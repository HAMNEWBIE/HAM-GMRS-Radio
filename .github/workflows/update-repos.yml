name: Weekly repo stats refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh repos-data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repos.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet repos-data.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "WSNJ234"
          git config user.email "WSNJ234@users.noreply.github.com"
          git add repos-data.json
          git commit -m "Weekly repo stats refresh"
          git push
